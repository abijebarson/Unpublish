<!DOCTYPE html>
<html lang="en">
<body>
    <div id="UnpublishConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-toggle">
        <div data-role="content">
            <div class="content-primary">
                <form id="UnpublishConfigForm">
                    
                    <div class="sectionTitleContainer flex align-items-center">
                        <h2 class="sectionTitle">Episode Control Mode</h2>
                    </div>
                    
                    <div class="paperList">
                        <label class="listItem">
                            <div class="listItemBody text-left">
                                <h3 class="listItemBodyText">Hide Completely</h3>
                                <div class="listItemBodyText secondary">Locked episodes are completely invisible in season lists, next up, search, and library views.</div>
                            </div>
                            <input type="radio" name="protectionMode" value="0" class="modeRadio" />
                        </label>
                        <label class="listItem">
                            <div class="listItemBody text-left">
                                <h3 class="listItemBodyText">Hide Spoilers</h3>
                                <div class="listItemBodyText secondary">Shows episode title & number only. Thumbnails and descriptions are masked with a padlock.</div>
                            </div>
                            <input type="radio" name="protectionMode" value="1" class="modeRadio" />
                        </label>
                        <label class="listItem">
                            <div class="listItemBody text-left">
                                <h3 class="listItemBodyText">Block Playback Only</h3>
                                <div class="listItemBodyText secondary">Thumbnails, titles, and descriptions remain visible, but playing locked episodes is disabled.</div>
                            </div>
                            <input type="radio" name="protectionMode" value="2" class="modeRadio" />
                        </label>
                    </div>

                    <div class="sectionTitleContainer flex align-items-center" style="margin-top: 2em;">
                        <h2 class="sectionTitle">TV Library Control</h2>
                        <span id="lockedCountBadge" style="margin-left:auto; color:var(--theme-primary-color);">0 items locked</span>
                    </div>

                    <div class="inputContainer">
                        <input type="text" id="treeSearchInput" is="emby-input" label="Search TV Shows:" autocomplete="off" />
                    </div>

                    <div style="margin-bottom: 1em;">
                        <button type="button" is="emby-button" class="raised" id="btnExpandAll">Expand All</button>
                        <button type="button" is="emby-button" class="raised" id="btnCollapseAll">Collapse All</button>
                        <button type="button" is="emby-button" class="raised button-delete" id="btnClearAll">Clear All Locks</button>
                    </div>

                    <div class="paperList" id="mediaTreeContainer" style="max-height: 500px; overflow-y: auto;">
                        <div style="padding:1em; color:#999;">Loading TV library...</div>
                    </div>

                    <div class="sectionTitleContainer flex align-items-center" style="margin-top: 2em;">
                        <h2 class="sectionTitle">Immune Users (Bypass Locks)</h2>
                    </div>
                    
                    <div class="paperList" id="userSelectionContainer">
                        <div style="padding:1em; color:#999;">Loading users...</div>
                    </div>

                    <div style="margin-top: 2em;">
                        <button type="submit" is="emby-button" class="raised button-submit block">Save Configuration</button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            var UnpublishApp = {
                pluginId: "A1B2C3D4-E5F6-4a1b-9c8d-7e6f5a4b3c2d",
                lockedItems: new Set(),
                immuneUsers: new Set(),
                protectionMode: 0,
                allShows: [],
                allUsers: [],
                nodeRegistry: new Map(),

                normalizeGuid: function(id) {
                    if (!id) return '';
                    return id.toString().replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                },

                load: function() {
                    Dashboard.showLoadingMsg();
                    
                    ApiClient.getPluginConfiguration(UnpublishApp.pluginId)
                    .then(function(config) {
                        UnpublishApp.lockedItems.clear();
                        (config.LockedItemIds || []).forEach(function(id) {
                            UnpublishApp.lockedItems.add(UnpublishApp.normalizeGuid(id));
                        });

                        UnpublishApp.immuneUsers.clear();
                        (config.ImmuneUserIds || []).forEach(function(id) {
                            UnpublishApp.immuneUsers.add(UnpublishApp.normalizeGuid(id));
                        });

                        UnpublishApp.protectionMode = config.ProtectionMode || 0;
                        document.querySelectorAll('.modeRadio').forEach(function(radio) {
                            if (parseInt(radio.value, 10) === UnpublishApp.protectionMode) {
                                radio.checked = true;
                            }
                        });

                        UnpublishApp.updateLockedCount();

                        ApiClient.getUsers().then(function(users) {
                            UnpublishApp.allUsers = users || [];
                            UnpublishApp.renderUsers();
                        }).catch(function(e) {
                            console.error("Failed to load users", e);
                        });

                        UnpublishApp.loadShows();
                    })
                    .catch(function(err) {
                        Dashboard.hideLoadingMsg();
                        document.querySelector('#mediaTreeContainer').innerHTML = 
                            '<div style="padding:1em; color:#ff3333">Failed to load configuration: ' + (err.status || err) + '</div>';
                    });
                },

                loadShows: function() {
                    ApiClient.getJSON(ApiClient.getUrl("Unpublish/Library/Shows"))
                    .then(function(shows) {
                        Dashboard.hideLoadingMsg();
                        UnpublishApp.allShows = shows || [];
                        UnpublishApp.renderTree(shows);
                    })
                    .catch(function(err) {
                        Dashboard.hideLoadingMsg();
                        document.querySelector('#mediaTreeContainer').innerHTML = 
                            '<div style="padding:1em; color:#ff3333">Error loading library: ' + (err.status || err) + '</div>';
                    });
                },

                renderTree: function(shows) {
                    var container = document.querySelector('#mediaTreeContainer');
                    container.innerHTML = '';
                    UnpublishApp.nodeRegistry.clear();

                    if (!shows || shows.length === 0) {
                        container.innerHTML = '<div style="padding:1em;">No TV series found.</div>';
                        return;
                    }

                    shows.forEach(function(show) {
                        var node = UnpublishApp.createNodeElement(show, 0);
                        container.appendChild(node);
                    });
                },

                createNodeElement: function(item, depth) {
                    var normalizedId = UnpublishApp.normalizeGuid(item.Id);
                    var isExpandable = item.Type === 'Series' || item.Type === 'Season';
                    var isLocked = UnpublishApp.lockedItems.has(normalizedId);

                    var wrapperDiv = document.createElement('div');
                    wrapperDiv.className = 'ec-tree-node';
                    wrapperDiv.dataset.id = item.Id;
                    wrapperDiv.dataset.normalizedId = normalizedId;
                    wrapperDiv.dataset.name = (item.Name || '').toLowerCase();
                    wrapperDiv.dataset.type = item.Type;

                    var itemDiv = document.createElement('div');
                    itemDiv.className = 'listItem';
                    itemDiv.style.paddingLeft = (depth * 2) + 'em';
                    
                    var bodyDiv = document.createElement('div');
                    bodyDiv.className = 'listItemBody text-left';
                    bodyDiv.style.cursor = 'pointer';
                    
                    var title = document.createElement('h3');
                    title.className = 'listItemBodyText';
                    title.textContent = item.Name;
                    bodyDiv.appendChild(title);
                    
                    if (isExpandable) {
                        var sub = document.createElement('div');
                        sub.className = 'listItemBodyText secondary expand-indicator';
                        sub.textContent = 'Click to expand ' + (item.Type === 'Series' ? 'seasons' : 'episodes');
                        bodyDiv.appendChild(sub);
                    } else {
                        var sub = document.createElement('div');
                        sub.className = 'listItemBodyText secondary';
                        sub.textContent = 'Episode';
                        bodyDiv.appendChild(sub);
                    }

                    itemDiv.appendChild(bodyDiv);

                    var label = document.createElement('label');
                    label.className = 'checkboxContainer';
                    var toggle = document.createElement('input');
                    toggle.type = 'checkbox';
                    toggle.setAttribute('is', 'emby-toggle');
                    toggle.className = 'emby-toggle ec-toggle';
                    toggle.checked = isLocked;
                    label.appendChild(toggle);
                    itemDiv.appendChild(label);

                    wrapperDiv.appendChild(itemDiv);

                    var childrenDiv = document.createElement('div');
                    childrenDiv.style.display = 'none';
                    wrapperDiv.appendChild(childrenDiv);

                    var nodeState = {
                        item: item,
                        normalizedId: normalizedId,
                        wrapperDiv: wrapperDiv,
                        itemDiv: itemDiv,
                        toggle: toggle,
                        childrenDiv: childrenDiv,
                        loaded: false,
                        isExpanded: false,
                        depth: depth
                    };

                    UnpublishApp.nodeRegistry.set(normalizedId, nodeState);

                    toggle.addEventListener('change', function(e) {
                        e.stopPropagation();
                        var checked = e.target.checked;
                        UnpublishApp.setNodeLockState(nodeState, checked, true);
                        UnpublishApp.updateLockedCount();
                    });

                    if (isExpandable) {
                        bodyDiv.addEventListener('click', function(e) {
                            if (e.target === toggle || e.target.tagName === 'INPUT') return;
                            
                            if (nodeState.isExpanded) {
                                nodeState.isExpanded = false;
                                childrenDiv.style.display = 'none';
                                bodyDiv.querySelector('.expand-indicator').textContent = 'Click to expand';
                            } else {
                                nodeState.isExpanded = true;
                                childrenDiv.style.display = 'block';
                                bodyDiv.querySelector('.expand-indicator').textContent = 'Click to collapse';

                                if (!nodeState.loaded) {
                                    childrenDiv.innerHTML = '<div style="padding:1em; padding-left:'+((depth+1)*2)+'em;" class="secondary">Loading...</div>';
                                    ApiClient.getJSON(ApiClient.getUrl("Unpublish/Library/Children?parentId=" + item.Id))
                                    .then(function(children) {
                                        childrenDiv.innerHTML = '';
                                        nodeState.loaded = true;
                                        if (!children || children.length === 0) {
                                            childrenDiv.innerHTML = '<div style="padding:1em; padding-left:'+((depth+1)*2)+'em;" class="secondary">No children found</div>';
                                            return;
                                        }
                                        var isParentLocked = UnpublishApp.lockedItems.has(nodeState.normalizedId);
                                        children.forEach(function(child) {
                                            var childNormId = UnpublishApp.normalizeGuid(child.Id);
                                            if (isParentLocked) {
                                                UnpublishApp.lockedItems.add(childNormId);
                                            }
                                            var childNode = UnpublishApp.createNodeElement(child, depth + 1);
                                            childrenDiv.appendChild(childNode);
                                        });
                                        UnpublishApp.updateLockedCount();
                                    })
                                    .catch(function(err) {
                                        childrenDiv.innerHTML = '<div style="padding:1em; padding-left:'+((depth+1)*2)+'em; color:#ff3333">Error: ' + (err.status || err) + '</div>';
                                    });
                                }
                            }
                        });
                    }

                    return wrapperDiv;
                },

                setNodeLockState: function(nodeState, locked, cascadeDown) {
                    if (locked) {
                        UnpublishApp.lockedItems.add(nodeState.normalizedId);
                        nodeState.toggle.checked = true;
                    } else {
                        UnpublishApp.lockedItems.delete(nodeState.normalizedId);
                        nodeState.toggle.checked = false;
                    }

                    if (cascadeDown && nodeState.childrenDiv) {
                        var childNodes = nodeState.childrenDiv.querySelectorAll('.ec-tree-node');
                        childNodes.forEach(function(childEl) {
                            var childNormId = childEl.dataset.normalizedId;
                            var childState = UnpublishApp.nodeRegistry.get(childNormId);
                            if (childState) {
                                UnpublishApp.setNodeLockState(childState, locked, true);
                            }
                        });
                    }
                },

                updateLockedCount: function() {
                    var count = UnpublishApp.lockedItems.size;
                    var badge = document.querySelector('#lockedCountBadge');
                    if (badge) {
                        badge.textContent = count === 1 ? '1 item locked' : count + ' items locked';
                    }
                },

                renderUsers: function() {
                    var container = document.querySelector('#userSelectionContainer');
                    container.innerHTML = '';

                    if (!UnpublishApp.allUsers || UnpublishApp.allUsers.length === 0) {
                        container.innerHTML = '<div style="padding:1em;">No users found.</div>';
                        return;
                    }

                    UnpublishApp.allUsers.forEach(function(user) {
                        var normalizedUserId = UnpublishApp.normalizeGuid(user.Id);
                        var isImmune = UnpublishApp.immuneUsers.has(normalizedUserId);
                        var isAdmin = user.Policy && user.Policy.IsAdministrator;

                        var itemDiv = document.createElement('div');
                        itemDiv.className = 'listItem';
                        
                        var bodyDiv = document.createElement('div');
                        bodyDiv.className = 'listItemBody text-left';
                        
                        var title = document.createElement('h3');
                        title.className = 'listItemBodyText';
                        title.textContent = user.Name;
                        bodyDiv.appendChild(title);
                        
                        var sub = document.createElement('div');
                        sub.className = 'listItemBodyText secondary';
                        sub.textContent = isAdmin ? 'Administrator' : 'User';
                        bodyDiv.appendChild(sub);

                        itemDiv.appendChild(bodyDiv);

                        var label = document.createElement('label');
                        label.className = 'checkboxContainer';
                        var toggle = document.createElement('input');
                        toggle.type = 'checkbox';
                        toggle.setAttribute('is', 'emby-toggle');
                        toggle.className = 'emby-toggle';
                        toggle.checked = isImmune;
                        label.appendChild(toggle);
                        itemDiv.appendChild(label);

                        toggle.addEventListener('change', function(e) {
                            if (e.target.checked) {
                                UnpublishApp.immuneUsers.add(normalizedUserId);
                            } else {
                                UnpublishApp.immuneUsers.delete(normalizedUserId);
                            }
                        });

                        container.appendChild(itemDiv);
                    });
                },

                save: function() {
                    Dashboard.showLoadingMsg();
                    
                    var selectedRadio = document.querySelector('.modeRadio:checked');
                    if (selectedRadio) {
                        UnpublishApp.protectionMode = parseInt(selectedRadio.value, 10);
                    }
                    
                    var config = {
                        LockedItemIds: Array.from(UnpublishApp.lockedItems),
                        ImmuneUserIds: Array.from(UnpublishApp.immuneUsers),
                        ProtectionMode: UnpublishApp.protectionMode
                    };

                    ApiClient.updatePluginConfiguration(UnpublishApp.pluginId, config)
                    .then(function() {
                        Dashboard.hideLoadingMsg();
                        Dashboard.processPluginConfigurationUpdateResult();
                    })
                    .catch(function(err) {
                        Dashboard.hideLoadingMsg();
                        Dashboard.alert({
                            message: "Failed to save configuration: " + (err.status || err)
                        });
                    });
                }
            };

            document.querySelector('#treeSearchInput').addEventListener('input', function(e) {
                var query = e.target.value.toLowerCase().trim();
                var nodes = document.querySelectorAll('#mediaTreeContainer > .ec-tree-node');
                nodes.forEach(function(node) {
                    var name = node.dataset.name || '';
                    if (!query || name.indexOf(query) !== -1) {
                        node.style.display = 'block';
                    } else {
                        node.style.display = 'none';
                    }
                });
            });

            document.querySelector('#btnExpandAll').addEventListener('click', function() {
                UnpublishApp.nodeRegistry.forEach(function(state) {
                    if (state.item.Type === 'Series' && !state.isExpanded) {
                        state.itemDiv.querySelector('.listItemBody').click();
                    }
                });
            });

            document.querySelector('#btnCollapseAll').addEventListener('click', function() {
                UnpublishApp.nodeRegistry.forEach(function(state) {
                    if (state.item.Type === 'Series' && state.isExpanded) {
                        state.itemDiv.querySelector('.listItemBody').click();
                    }
                });
            });

            document.querySelector('#btnClearAll').addEventListener('click', function() {
                if (confirm("Are you sure you want to unlock all items?")) {
                    UnpublishApp.lockedItems.clear();
                    document.querySelectorAll('.ec-toggle').forEach(function(cb) {
                        cb.checked = false;
                    });
                    UnpublishApp.updateLockedCount();
                }
            });

            document.querySelector('#UnpublishConfigPage').addEventListener('pageshow', function() {
                UnpublishApp.load();
            });

            document.querySelector('#UnpublishConfigForm').addEventListener('submit', function(e) {
                e.preventDefault();
                UnpublishApp.save();
            });
        </script>
    </div>
</body>
</html>
